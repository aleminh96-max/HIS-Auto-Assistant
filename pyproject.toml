[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "his-auto-assistant"
version = "0.1.0"
description = "Vietnamese Windows assistant and isolated HIS simulator"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "Pillow>=11,<13", "opencv-python-headless>=4.10,<5", "pywinauto>=0.6.9; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pyinstaller>=6.11,<7"]

[project.scripts]
his-assistant = "his_auto.ui:main"
his-simulator = "his_auto.simulator_ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
