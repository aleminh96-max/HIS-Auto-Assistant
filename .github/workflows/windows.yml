name: Windows trial build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -v --junitxml=test-results.xml
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build trial EXEs
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Smoke test frozen Windows applications
        shell: pwsh
        run: ./scripts/smoke_exe.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
      - uses: actions/upload-artifact@v4
        with:
          name: HIS-Auto-Assistant-trial-win64
          path: dist/HIS-Auto-Assistant-trial-win64.zip
          retention-days: 30
